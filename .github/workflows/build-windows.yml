name: Build Windows widget

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64
        run: dotnet publish CalendarWidget/CalendarWidget.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish
      - name: Remove duplicate WebView2Loader.dll from runtime subfolder
        shell: pwsh
        run: |
          # WebView2's NuGet targets can publish the same native x64 loader
          # both beside the EXE and under runtimes/win-x64/native. Keep the
          # root copy needed for loading, and only drop an identical duplicate.
          $root = Join-Path "publish" "WebView2Loader.dll"
          $duplicate = Join-Path "publish" "runtimes/win-x64/native/WebView2Loader.dll"
          if ((Test-Path $root) -and (Test-Path $duplicate)) {
            $rootHash = (Get-FileHash $root -Algorithm SHA256).Hash
            $duplicateHash = (Get-FileHash $duplicate -Algorithm SHA256).Hash
            if ($rootHash -ne $duplicateHash) {
              throw "Different WebView2Loader.dll binaries: refusing to remove either copy"
            }
            Remove-Item $duplicate
            Remove-Item (Split-Path $duplicate) -Force
            Remove-Item (Split-Path (Split-Path $duplicate)) -Force
            Remove-Item (Split-Path (Split-Path (Split-Path $duplicate))) -Force
            Write-Host "Removed identical redundant WebView2Loader.dll from runtimes/."
          } else {
            Write-Host "No duplicated WebView2Loader.dll found; preserving existing loader."
          }
          if (!(Test-Path $root) -and !(Test-Path $duplicate)) {
            throw "No WebView2Loader.dll in the published application"
          }
      - name: Include runtime requirements in artifact
        shell: pwsh
        run: |
          @'
          CalendarWidget for Windows x64
          ==============================
          This is a framework-dependent .NET 8 publish, not a self-contained installer.
          Install Microsoft .NET Desktop Runtime 8 (x64):
          https://dotnet.microsoft.com/en-us/download/dotnet/8.0
          Install Microsoft Edge WebView2 Runtime separately:
          https://developer.microsoft.com/en-us/microsoft-edge/webview2/

          Extract this archive and launch CalendarWidget.exe.
          See TRAY-CONTROLS.md in the repository for more information.
          '@ | Set-Content -Path publish/RUNTIME-REQUIREMENTS.txt -Encoding utf8
      - name: Upload framework-dependent artifact (.NET 8 Desktop Runtime required)
        uses: actions/upload-artifact@v4
        with:
          name: calendar-widget-tray-win-x64
          path: publish/
